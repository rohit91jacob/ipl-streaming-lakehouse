# Spark/JVM logging for the pipelines: warnings and errors only, on stderr.
rootLogger.level = warn
rootLogger.appenderRef.stderr.ref = console

appender.console.type = Console
appender.console.name = console
appender.console.target = SYSTEM_ERR
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd'T'HH:mm:ss.SSS} %p %c{1}: %m%n%ex

# Known-noisy loggers
logger.kafka.name = org.apache.kafka
logger.kafka.level = warn
logger.hadoop.name = org.apache.hadoop
logger.hadoop.level = error
logger.parquet.name = org.apache.parquet
logger.parquet.level = error
logger.nativecode.name = org.apache.hadoop.util.NativeCodeLoader
logger.nativecode.level = error
logger.delta.name = org.apache.spark.sql.delta
logger.delta.level = warn
logger.offsetseq.name = org.apache.spark.sql.execution.streaming.OffsetSeqLog
logger.offsetseq.level = error
