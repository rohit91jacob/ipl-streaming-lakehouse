[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ipl-streaming-lakehouse"
version = "0.1.0"
description = "IPL ball-by-ball lakehouse: Cricsheet batch medallion plus Kafka + Spark Structured Streaming live scorecards on Delta Lake."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.14"
authors = [{ name = "rohit91jacob" }]
keywords = ["ipl", "cricket", "cricsheet", "spark", "kafka", "delta-lake", "lakehouse", "streaming"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
  # Spark, Delta and the Kafka connector are pinned as a tested set: delta-spark
  # resolves io.delta:delta-spark_<spark major.minor>_2.13 at runtime.
  "pyspark==4.1.3",
  "delta-spark==4.4.1",
  "confluent-kafka>=2.16,<3",
  "deltalake>=1.6,<2",
  "pyarrow>=18",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.50,<2", "pandas>=2.2"]

[project.scripts]
ipl = "ipl_lakehouse.cli:main"

[project.urls]
Homepage = "https://github.com/rohit91jacob/ipl-streaming-lakehouse"
Data = "https://cricsheet.org/"

[dependency-groups]
dev = [
  "pytest>=9,<10",
  "pytest-cov>=7,<8",
  "ruff>=0.16,<0.17",
  "pre-commit>=4,<5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/ipl_lakehouse"]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["data"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PTH", "PIE", "RET", "TID"]
ignore = [
  "RET504", # assigning before return keeps Spark pipelines readable
  "E501",   # line length is enforced by `ruff format`; long SQL/strings are allowed
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PTH", "B011"]

[tool.ruff.lint.isort]
known-first-party = ["ipl_lakehouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "spark: needs a local Spark JVM (Java 17+); Delta/Kafka jars are fetched from Maven Central",
  "integration: needs a running Kafka broker at IPL_KAFKA_BOOTSTRAP_SERVERS",
]
filterwarnings = ["ignore::DeprecationWarning:pyspark.*"]

[tool.coverage.run]
source = ["ipl_lakehouse"]
omit = ["src/ipl_lakehouse/dashboard/*"]

[tool.coverage.report]
show_missing = true
skip_covered = true
